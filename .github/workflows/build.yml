name: Build, Push and Deploy

on:
  push:
    branches:
      - main  # o tu rama deseada

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t ricardoschmg/miapp:latest .
          docker push ricardoschmg/miapp:latest

      - name: Deploy container
        run: |
          docker container stop miapp || true
          docker container rm miapp || true
          docker run -d --name miapp -p 8080:8080 ricardoschmg/miapp:latest